<!DOCTYPE html>
<!-- psToDo dashboard. psToDo-HTML-Report-v1.3.ps1 fills the __PSTODO_*__ placeholders and writes index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PsToDo - Calendar Reminder</title>
<script>
  // Saved theme (shared with the editor)
  try { var t = localStorage.getItem('psToDo.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { }
</script>

<style>
  :root {
    color-scheme: light;
    --bg: #eef1f4; --surface: #ffffff; --surface-2: #f6f8fa;
    --line: #e4e8ec; --line-2: #d3dae0;
    --fg: #25303b; --fg-2: #4a5561; --muted: #66717c;
    --accent: #1a9690; --accent-hover: #15827d; --accent-ink: #0d7570; --accent-soft: #e2f3f2;
    --side: #2d3642; --side-fg: #c2cad3; --side-line: #3a4552;
    --head: #333d49; --head-fg: #ffffff;
    --s-ok: #2f9e5f; --s-warn: #e0a210; --s-serious: #ec835a; --s-crit: #d03b3b; --s-none: #9aa4ae;
    --t-ok: #e7f5e7; --t-warn: #fff4dc; --t-serious: #fdede6; --t-crit: #fbe8e8; --t-none: #eef1f4;
    --t-active: #e3eefb; --i-active: #2a78d6; --warn-ink: #855a00;
    --x-expired: #c93636; --x-critical: #c2561c; --x-warning: #9a6800; --x-ok: #17853c;
    --shadow: 0 1px 2px rgba(20, 30, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12161b; --surface: #1b2027; --surface-2: #212730;
      --line: #2b323b; --line-2: #3a434d;
      --fg: #e3e8ed; --fg-2: #c2cad2; --muted: #9aa5b0;
      --accent: #1f9e97; --accent-hover: #23b0a8; --accent-ink: #4fcac1; --accent-soft: #14312f;
      --side: #0e1216; --side-fg: #a9b3bd; --side-line: #222a32;
      --head: #29313a; --head-fg: #f1f4f6;
      --t-ok: rgba(12, 163, 12, .16); --t-warn: rgba(250, 178, 25, .15); --t-serious: rgba(236, 131, 90, .16);
      --t-crit: rgba(208, 59, 59, .2); --t-none: #262d36; --t-active: rgba(57, 135, 229, .18); --i-active: #6aa7ef; --warn-ink: #f2c35a;
      --x-expired: #ff7b7b; --x-critical: #f39a6b; --x-warning: #f2c35a; --x-ok: #56cf72;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12161b; --surface: #1b2027; --surface-2: #212730;
    --line: #2b323b; --line-2: #3a434d;
    --fg: #e3e8ed; --fg-2: #c2cad2; --muted: #9aa5b0;
    --accent: #1f9e97; --accent-hover: #23b0a8; --accent-ink: #4fcac1; --accent-soft: #14312f;
    --side: #0e1216; --side-fg: #a9b3bd; --side-line: #222a32;
    --head: #29313a; --head-fg: #f1f4f6;
    --t-ok: rgba(12, 163, 12, .16); --t-warn: rgba(250, 178, 25, .15); --t-serious: rgba(236, 131, 90, .16);
    --t-crit: rgba(208, 59, 59, .2); --t-none: #262d36; --t-active: rgba(57, 135, 229, .18); --i-active: #6aa7ef; --warn-ink: #f2c35a;
    --x-expired: #ff7b7b; --x-critical: #f39a6b; --x-warning: #f2c35a; --x-ok: #56cf72;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  a { color: var(--accent-ink); }
  button { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7;
          stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  .glyph { width: 14px; height: 14px; flex: none; vertical-align: -2px; }
  .muted { color: var(--muted); }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 88px minmax(0, 1fr); min-height: 100vh; }
  .app.nav-hidden { grid-template-columns: 0 minmax(0, 1fr); }
  .app.nav-hidden .side { visibility: hidden; }
  .side { background: var(--side); color: var(--side-fg); position: sticky; top: 0; height: 100vh;
          display: flex; flex-direction: column; overflow: hidden; z-index: 20; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 6px 14px;
           color: #fff; text-decoration: none; font-size: 11px; font-weight: 600; letter-spacing: .02em;
           border-bottom: 1px solid var(--side-line); }
  .brand { background: rgba(0, 0, 0, .18); }
  svg.brand-logo { width: 44px; height: auto; display: block; }
  .eyebrow { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--fg-2); }
  svg.eyebrow-logo { width: 18px; height: auto; }
  .nav { display: flex; flex-direction: column; }
  .nav-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 14px 4px; width: 100%; font-family: inherit;
              color: var(--side-fg); text-decoration: none; font-size: 11px; border: 0; background: none;
              cursor: pointer; border-left: 3px solid transparent; }
  .nav-item svg.i { width: 24px; height: 24px; stroke-width: 1.5; }
  .nav-item:hover { color: #fff; background: rgba(255, 255, 255, .05); }
  .nav-item.active { background: var(--accent); color: #fff; }
  .nav-item:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
  .nav-badge { position: absolute; top: 7px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px;
               border-radius: 9px; background: #d03b3b; color: #fff; font-size: 10.5px; font-weight: 700; line-height: 18px; text-align: center; }
  .nav-sep { height: 1px; background: var(--side-line); margin: 8px 14px; }
  .side-foot { margin-top: auto; padding: 12px 6px; text-align: center; font-size: 10px; opacity: .7; }

  .topbar { display: flex; align-items: stretch; height: 60px; background: var(--surface);
            border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .menu { width: 60px; border: 0; border-right: 1px solid var(--line); background: none; cursor: pointer; color: var(--fg-2); }
  .menu:hover { color: var(--accent-ink); }
  .crumbs { display: flex; align-items: center; gap: 10px; padding: 0 20px; min-width: 0; color: var(--muted); font-size: 13px; }
  .crumbs .cur { color: var(--fg); font-weight: 600; }
  .crumbs .sep { opacity: .6; }
  .crumbs span { white-space: nowrap; }
  .crumbs .crumb-org { display: inline-flex; gap: 8px; align-items: center; }
  .actions { margin-left: auto; display: flex; }
  .act { width: 60px; border: 0; border-left: 1px solid rgba(255, 255, 255, .35); background: var(--accent);
         color: #fff; cursor: pointer; display: grid; place-items: center; }
  .act:hover { background: var(--accent-hover); }
  .act:focus-visible { outline: 2px solid var(--fg); outline-offset: -4px; }
  .act svg.i { width: 20px; height: 20px; }

  /* ---------- profile header ---------- */
  .profile { background: var(--surface); border-bottom: 1px solid var(--line); padding: 26px 28px 0; }
  .profile-grid > div { min-width: 0; }
  .profile-grid { display: grid; grid-template-columns: minmax(180px, 1.2fr) repeat(4, minmax(120px, 1fr)) auto;
                  gap: 20px 32px; align-items: start; }
  .eyebrow { font-size: 11px; color: var(--muted); }
  .org { font-size: 20px; font-weight: 600; margin: 2px 0 2px; line-height: 1.25; }
  .ident .sub { color: var(--muted); font-size: 13px; }
  .fact { margin-bottom: 14px; min-width: 0; }
  .fact .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
  .fact .v { font-size: 13px; font-weight: 600; }
  .fact .s { font-size: 12px; color: var(--muted); }
  .fact .lnk { background: none; border: 0; padding: 0; color: var(--accent-ink); cursor: pointer; font-weight: 600; font-size: 13px; }
  .fact .lnk:hover { text-decoration: underline; }
  .logo-slot { text-align: center; min-width: 120px; }
  .logo-slot img { max-height: 64px; max-width: 180px; display: block; margin: 0 auto 6px; }
  .logo-slot .cap { font-size: 12px; font-weight: 600; color: var(--fg-2); }

  .tabbar { display: flex; align-items: center; gap: 16px; margin-top: 10px; border-top: 1px solid var(--line); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; }
  .tab { border: 0; background: none; padding: 14px 12px 12px; cursor: pointer; white-space: nowrap;
         font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-2);
         border-bottom: 2px solid transparent; }
  .tab:first-child { padding-left: 0; }
  .tab:hover { color: var(--accent-ink); }
  .tab.active { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .tab .c { margin-left: 5px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .tab.active .c { color: var(--accent-ink); }
  .attn { margin-left: auto; font-size: 12px; white-space: nowrap; color: var(--warn-ink); display: flex; gap: 6px; align-items: center; }
  .attn svg.i { width: 15px; height: 15px; }
  .attn button { border: 0; background: none; padding: 0; color: inherit; cursor: pointer; font-size: 12px; }
  .attn button:hover { text-decoration: underline; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- content ---------- */
  .content { padding: 24px 28px 36px; max-width: 1680px; }
  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 6px;
            margin-bottom: 16px; background: var(--t-warn); border: 1px solid var(--s-warn); color: var(--fg); }
  .banner.bad { background: var(--t-crit); border-color: var(--s-crit); }
  .banner.info { background: var(--surface); border-color: var(--line); color: var(--fg-2); }
  .banner b { font-weight: 600; }
  .toolbar { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line-2);
            border-radius: 6px; padding: 0 12px; height: 38px; width: 360px; max-width: 100%; color: var(--muted); }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input { border: 0; outline: 0; background: none; color: var(--fg); font: inherit; width: 100%; }
  .link-btn { display: inline-flex; gap: 6px; align-items: center; border: 0; background: none; cursor: pointer;
              color: var(--fg-2); font-size: 13px; padding: 6px 2px; }
  .link-btn:hover { color: var(--accent-ink); }
  .link-btn svg.i { width: 16px; height: 16px; }

  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
  .kpi { position: relative; text-align: left; background: var(--surface); border: 1px solid var(--line);
         border-radius: 6px; padding: 14px 18px 14px 20px; cursor: pointer; box-shadow: var(--shadow); overflow: hidden; }
  .kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--bar); }
  .kpi:hover { border-color: var(--line-2); }
  .kpi.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .kpi .n { font-size: 26px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--num); }
  .kpi .l { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .kpi .h { font-size: 12px; color: var(--muted); }
  .kpi:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 20px;
           box-shadow: var(--shadow); }
  .panel-head { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel-head.dark { background: var(--head); color: var(--head-fg); border-bottom: 0; border-radius: 6px 6px 0 0; padding: 13px 20px; }
  .panel-head.dark .count { color: var(--head-fg); opacity: .8; min-width: 70px; text-align: right; }
  .tl-combo { position: relative; display: inline-flex; align-items: center; height: 28px; border-radius: 6px;
               border: 1px solid rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .04); }
  .tl-combo:focus-within { border-color: var(--accent); background: rgba(255, 255, 255, .08); }
  .tl-combo.bad { border-color: #ff8f8f; }
  .tl-combo input { width: 92px; height: 100%; border: 0; background: none; padding: 0 2px 0 10px; font: inherit; font-size: 12.5px;
                    color: var(--head-fg); outline: none; }
  .tl-combo input::placeholder { color: #9aa5b0; opacity: 1; }
  .tl-combo .unit { font-size: 12px; color: #9aa5b0; padding-right: 2px; }
  .tl-combo .caret { border: 0; background: none; color: var(--head-fg); height: 100%; width: 26px; cursor: pointer;
                     display: grid; place-items: center; border-left: 1px solid rgba(255, 255, 255, .18); }
  .tl-combo .caret svg.i { width: 15px; height: 15px; }
  .tl-combo .caret:hover { background: rgba(255, 255, 255, .08); }
  .tl-menu { position: absolute; top: calc(100% + 4px); left: -1px; right: -1px; z-index: 30; margin: 0; padding: 4px 0; list-style: none;
             background: var(--surface); color: var(--fg); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: 0 8px 22px rgba(0, 0, 0, .18); }
  .tl-menu button { display: flex; justify-content: space-between; width: 100%; border: 0; background: none; padding: 6px 12px;
                    font: inherit; font-size: 13px; color: inherit; cursor: pointer; text-align: left; }
  .tl-menu button:hover, .tl-menu button:focus { background: var(--accent-soft); outline: none; }
  .tl-menu button[aria-selected="true"] { color: var(--accent-ink); font-weight: 600; }
  .tl-menu button[aria-selected="true"]::after { content: '✓'; }
  .tl-menu .hint { padding: 6px 12px 4px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 4px; }
  .collapse:focus-visible, .tl-combo .caret:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  .collapse { border: 0; background: none; color: var(--head-fg); cursor: pointer; padding: 2px; display: grid; place-items: center; border-radius: 4px; }
  .collapse:hover { background: rgba(255, 255, 255, .1); }
  .collapse svg.i { transition: transform .15s; }
  .collapsed .collapse svg.i { transform: rotate(180deg); }
  .collapsed #tlBody { display: none; }
  .collapsed .panel-head.dark { border-radius: 6px; }
  .panel-head svg.i { width: 18px; height: 18px; }
  .panel-head .link-btn { color: var(--accent-ink); font-size: 12.5px; padding: 0; }
  .panel-head .right { margin-left: auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .count { font-size: 12px; color: var(--muted); }

  /* ---------- editor ---------- */
  .editor-panel { overflow: hidden; }
  .editor-panel iframe { display: block; width: 100%; border: 0; background: var(--bg); min-height: 480px; }
  .editor-note { font-size: 12px; color: var(--muted); }

  /* ---------- timeline ---------- */
  .tl-wrap { position: relative; padding: 18px 20px 4px; }
  .tl-wrap svg { display: block; width: 100%; overflow: visible; }
  .tl-grid { stroke: var(--line); stroke-width: 1; }
  .tl-label { fill: var(--muted); font-size: 12px; }
  .tl-today { stroke: var(--accent); stroke-width: 2; }
  .tl-today-label { fill: var(--muted); font-size: 12px; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .dot.expired, .lg-dot.expired { fill: var(--s-crit); background: var(--s-crit); }
  .dot.critical, .lg-dot.critical { fill: var(--s-serious); background: var(--s-serious); }
  .dot.warning, .lg-dot.warning { fill: var(--s-warn); background: var(--s-warn); }
  .dot.ok, .lg-dot.ok { fill: var(--s-ok); background: var(--s-ok); }
  .mk { cursor: pointer; outline: none; }
  .mk .hit { fill: transparent; }
  .mk:hover .dot, .mk:focus .dot { stroke: var(--fg); stroke-width: 2; }
  .tl-legend { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 6px 20px 16px; font-size: 12px; color: var(--fg-2); }
  .tl-legend span, .tl-legend button { display: inline-flex; gap: 6px; align-items: center; }
  .tl-legend button { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; font-size: 12px; }
  .tl-legend button:hover { text-decoration: underline; }
  .tl-legend .later { color: var(--x-expired); font-weight: 600; }
  .tl-legend { align-items: center; }
  .sw { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 2px 0; cursor: pointer;
        font: inherit; font-size: 12.5px; color: var(--fg-2); }
  .tl-legend button.sw, .tl-legend button.sw:hover { color: var(--fg-2); text-decoration: none; }
  .sw .track { position: relative; width: 30px; height: 17px; border-radius: 9px; background: var(--line-2); transition: background .15s; flex: none; }
  .sw .knob { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff;
              box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s; }
  .sw[aria-checked="true"] .track { background: var(--accent); }
  .sw[aria-checked="true"] .knob { transform: translateX(13px); }
  .sw[aria-checked="false"] { color: var(--muted); }
  .sw[aria-checked="false"] .lg-dot { opacity: .35; }
  .sw .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .tl-lane { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 3 3; }
  .lg-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .tip { position: absolute; z-index: 5; pointer-events: none; min-width: 200px; max-width: 280px;
         background: var(--head); color: var(--head-fg); border-radius: 6px; padding: 9px 12px; font-size: 12px;
         box-shadow: 0 6px 18px rgba(0, 0, 0, .18); transform: translate(-50%, -100%); }
  .tip b { display: block; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .tip .row2 { opacity: .85; }
  .tl-empty { padding: 26px 20px; color: var(--muted); font-size: 13px; }

  /* ---------- overview feeds ---------- */
  .feeds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .afeed { list-style: none; margin: 0; padding: 4px 20px 10px; }
  .afeed li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .afeed li:last-child { border-bottom: 0; }
  .afeed .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .afeed .ico svg.i { width: 17px; height: 17px; }
  .afeed .ico.today { background: var(--t-serious); color: var(--x-critical); }
  .afeed .ico.sent { background: var(--accent-soft); color: var(--accent-ink); }
  .afeed .meta { font-size: 12px; color: var(--muted); }
  .afeed .txt { font-size: 13.5px; }
  .afeed .obj { border: 0; background: none; padding: 0; font: inherit; color: var(--accent-ink); cursor: pointer; text-align: left; font-weight: 600; }
  .afeed .obj:hover { text-decoration: underline; }

  /* ---------- tables ---------- */
  .table-wrap { overflow-x: auto; }
  table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 1200px; }
  table.grid.no-owner { min-width: 1080px; }
  table.grid.small { min-width: 640px; }
  .grid th { text-align: left; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); padding: 10px; background: var(--surface-2); border-bottom: 1px solid var(--line);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid th.sort { cursor: pointer; user-select: none; }
  .grid th.sort:hover { color: var(--accent-ink); }
  .grid th .arrow { color: var(--accent-ink); margin-left: 4px; font-size: 9px; }
  .grid td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13.5px; }
  .grid td .sub { font-size: 12px; color: var(--muted); }
  .grid td.num { white-space: nowrap; }
  .grid td.name { font-weight: 600; }
  .grid tr.row { cursor: pointer; }
  .grid tr.row:hover td { background: var(--surface-2); }
  .grid tr.row:focus-visible td { background: var(--accent-soft); outline: none; }
  .grid tr.row.open td { background: var(--surface-2); border-bottom-color: transparent; }
  .grid tr.flash td { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
  .chev { display: inline-block; color: var(--muted); transition: transform .12s; }
  .chev svg.i { width: 14px; height: 14px; }
  tr.open .chev { transform: rotate(90deg); color: var(--accent-ink); }
  .grid td.id { color: var(--muted); }
  .due { color: var(--accent-ink); font-weight: 600; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 6px; border-radius: 999px;
           font-size: 12px; white-space: nowrap; background: var(--t-none); color: var(--fg); }
  .badge.expired { background: var(--t-crit); }
  .badge.critical { background: var(--t-serious); }
  .badge.warning { background: var(--t-warn); }
  .badge.ok { background: var(--t-ok); }
  .badge.plain { padding-left: 9px; }
  .badge.st-active { background: var(--t-active); }
  .badge.st-completed { background: var(--t-ok); }
  .badge.sev-high { background: var(--t-warn); }
  .badge.sev-critical { background: var(--t-crit); }

  /* ---------- detail ---------- */
  tr.detail > td { background: var(--surface-2); padding: 4px 20px 22px 44px; border-bottom: 1px solid var(--line); }
  .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; }
  .box-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px;
              background: var(--head); color: var(--head-fg); font-size: 13px; font-weight: 600; }
  .box-head a { color: var(--head-fg); font-weight: 400; font-size: 12px; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
  .box-head a:hover { text-decoration: underline; }
  .box-head svg.i { width: 15px; height: 15px; }
  .box-head.light { background: var(--surface); color: var(--fg); border-bottom: 1px solid var(--line); }
  .kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); margin: 0; padding: 4px 16px 10px; font-size: 13px; }
  .kv dt { padding: 8px 0; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
           color: var(--muted); border-bottom: 1px solid var(--line); }
  .kv dd { margin: 0; padding: 7px 0 7px 8px; border-bottom: 1px solid var(--line); word-break: break-word; }
  .kv dt:nth-last-of-type(1), .kv dd:last-of-type { border-bottom: 0; }
  .subhead { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; font-size: 12px; font-weight: 600; color: var(--fg-2); }
  .onoff { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--t-none); color: var(--muted); }
  .onoff.on { background: var(--accent-soft); color: var(--accent-ink); }
  .off-block .kv dd { color: var(--muted); }

  .feed { list-style: none; margin: 0; padding: 6px 16px 8px; }
  .feed li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .feed li:last-child { border-bottom: 0; }
  .feed .ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--t-none); color: var(--muted); }
  .feed .ico svg.i { width: 14px; height: 14px; stroke-width: 2.2; }
  .feed .ico.sent { background: var(--t-ok); color: var(--s-ok); }
  .feed .ico.due { background: var(--accent-soft); color: var(--accent-ink); }
  .feed .ico.nochannel, .feed .ico.missed { background: var(--t-warn); color: var(--warn-ink); }
  .feed .when { font-size: 11.5px; color: var(--muted); }
  .feed .what { font-size: 13px; }
  .feed .what .lvl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-left: 6px; }
  .feed .state { font-size: 12.5px; font-weight: 600; }
  .feed .state.sent { color: var(--s-ok); }
  .feed .state.due { color: var(--accent-ink); }
  .feed .state.upcoming { color: var(--fg-2); font-weight: 400; }
  .feed .state.missed, .feed .state.nochannel { color: var(--warn-ink); }
  .desc { padding: 12px 16px 14px; font-size: 13px; border-top: 1px solid var(--line); }
  .desc .k { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }

  .empty { padding: 28px 20px; color: var(--muted); text-align: center; }
  footer { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .print-head { display: none; }


  /* ---------- responsive ---------- */
  @media (max-width: 1280px) {
    .profile-grid { grid-template-columns: minmax(200px, 1.2fr) repeat(3, minmax(140px, 1fr)); }
    .logo-slot { display: none; }
    .profile-grid { grid-template-columns: minmax(180px, 1.2fr) repeat(4, minmax(110px, 1fr)); }
    .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .app, .app.nav-hidden { grid-template-columns: minmax(0, 1fr); }
    .side { position: fixed; left: 0; top: 0; width: 88px; transform: translateX(-100%); transition: transform .15s; visibility: visible; }
    .app.nav-open .side { transform: none; box-shadow: 4px 0 20px rgba(0, 0, 0, .3); }
    .app.nav-hidden .side { visibility: visible; }
    .profile, .content { padding-left: 16px; padding-right: 16px; }
    .profile-grid { grid-template-columns: 1fr 1fr; gap: 6px 20px; }
    .feeds { grid-template-columns: minmax(0, 1fr); }
    .attn { display: none; }
    .ident { grid-column: 1 / -1; margin-bottom: 8px; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .detail-grid { grid-template-columns: minmax(0, 1fr); }
    tr.detail > td { padding: 4px 10px 16px; }
    .crumbs .hide-sm { display: none; }
    .act, .menu { width: 48px; }
    .search { width: 100%; }
  }

  /* ---------- print ---------- */
  @page { size: A4 landscape; margin: 10mm; }
  @media print {
    :root, :root[data-theme], :root:not([data-theme="light"]) {
      color-scheme: light;
      --bg: #ffffff; --surface: #ffffff; --surface-2: #f6f8fa; --line: #dfe4e8; --line-2: #cfd6dc;
      --fg: #1d262f; --fg-2: #3f4a55; --muted: #5e6974; --accent-ink: #0d7570; --accent-soft: #e2f3f2;
      --head: #333d49; --head-fg: #ffffff;
      --t-ok: #e7f5e7; --t-warn: #fff4dc; --t-serious: #fdede6; --t-crit: #fbe8e8; --t-none: #eef1f4; --t-active: #e3eefb;
      --warn-ink: #855a00; --shadow: none;
      --x-expired: #c93636; --x-critical: #c2561c; --x-warning: #9a6800; --x-ok: #17853c;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { font-size: 11px; background: #fff; }
    .app, .app.nav-hidden { display: block; }
    .side, .topbar, .tabbar, .toolbar, #stale, footer .no-print, .tl-combo, .collapse { display: none !important; }
    .feeds { grid-template-columns: 1fr 1fr; }
    .print-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 0 8px;
                  border-bottom: 2px solid var(--fg); margin-bottom: 12px; }
    .print-head b { font-size: 16px; }
    .profile { padding: 0 0 8px; border: 0; }
    .content { padding: 0; max-width: none; }
    .cards { grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .kpi { padding: 8px 12px; }
    .kpi .n { font-size: 20px; }
    .panel { break-inside: auto; margin-bottom: 10px; border-color: var(--line-2); }
    #timeline, .feeds .panel { break-inside: avoid; }
    .table-wrap { overflow: visible; }
    table.grid, table.grid.no-owner { min-width: 0; table-layout: auto; }
    .grid .ell { white-space: normal; }
    .grid th, .grid td { padding: 5px 6px; }
    .grid tr { break-inside: avoid; }
    .chev { display: none; }
    .tip { display: none !important; }
  }
</style>
</head>
