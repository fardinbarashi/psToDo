<script>
(function () {
'use strict';

const $ = id => document.getElementById(id);
const read = (id, fallback) => { try { return JSON.parse($(id).textContent); } catch (e) { return fallback; } };
const META      = read('meta', {}) || {};
const DATA      = read('data', []) || [];
const COMPLETED = read('completed', []) || [];
const INVALID   = read('invalid', []) || [];
const NONCRED   = read('noncred', []) || [];

const ORG = (META.organization || '').trim();
const TL_DEFAULT = Number(META.timelineDays) > 0 ? Math.round(Number(META.timelineDays)) : 90;
const TL_OPTIONS = Array.from(new Set([30, 60, 90, 180, 365, TL_DEFAULT])).sort((a, b) => a - b);
// Per-browser settings
const store = {
  get: k => { try { return localStorage.getItem('psToDo.' + k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem('psToDo.' + k, String(v)); } catch (e) { } }
};
const TL_MAX = 3650;
const validDays = v => { const n = Number(v); return Number.isInteger(n) && n >= 1 && n <= TL_MAX ? n : null; };
let TL_DAYS = validDays(store.get('tlDays')) || TL_DEFAULT;
let TL_COLLAPSED = store.get('tlCollapsed') === '1';
// Statuses shown on the timeline
let TL_SHOW = { expired: true, critical: true, warning: true, ok: true };
try { const saved = JSON.parse(store.get('tlShow') || 'null'); if (saved) Object.keys(TL_SHOW).forEach(k => { if (saved[k] === false) TL_SHOW[k] = false; }); } catch (e) { }
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DASH = '—';
const MINUS = '−';

const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const safeUrl = u => (/^(https?:\/\/|[A-Za-z0-9_.\/-]+$)/.test(u || '') ? u : '');
const EDITOR = safeUrl(META.editorUrl || '');
// Edit only for the editors group (psToDo-api.ashx?action=whoami)
const API = EDITOR ? EDITOR.replace(/[^\/]*$/, '') + 'psToDo-api.ashx?action=whoami' : '';
let CAN_EDIT = false;

const ICON = {
  chev:  '<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  mail:  '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>',
  teams: '<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 4z"/></svg>',
  edit:  '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>',
  send:  '<svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>',
  dash:  '<svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg>',
  warn:  '<svg class="i" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.3"/></svg>',
  bell:  '<svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
  cal:   '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>'
};
const glyph = key => '<svg class="glyph" aria-hidden="true"><use href="#g-' + (key || 'none') + '"/></svg>';

const URGENCY = [
  { key: 'expired',  label: 'Expired',  bar: 'var(--s-crit)' },
  { key: 'critical', label: 'Critical', bar: 'var(--s-serious)' },
  { key: 'warning',  label: 'Warning',  bar: 'var(--s-warn)' },
  { key: 'ok',       label: 'OK',       bar: 'var(--s-ok)' }
];
const URG_LABEL = { expired: 'Expired', critical: 'Critical', warning: 'Warning', ok: 'OK', none: 'No date' };

const TABS = [
  { key: 'overview',     label: 'Overview' },
  { key: 'monitored',    label: 'Monitored' },
  { key: 'completed',    label: 'Completed' },
  { key: 'nochannel',    label: 'No channel',     attn: true },
  { key: 'noncred',      label: 'No credentials' },
  { key: 'notmonitored', label: 'Not monitored',  attn: true },
  { key: 'edit',         label: 'Edit',           editor: true }
];

const DEFAULTS = { filter: '', urgency: null, sortKey: 'daysLeft', sortDir: 1, tab: 'overview' };
let state = Object.assign({}, DEFAULTS);
const openRows = new Set();

// ------------------------------------------------------------------ common
const isCompleted = r => String(r.status || '').toLowerCase() === 'completed';
const monitored = () => DATA.filter(r => !isCompleted(r));
const noChannelRows = () => DATA.filter(r => !r.mailOn && !r.teamsOn && !isCompleted(r));
const tabBase = () => (state.tab === 'completed' ? COMPLETED : monitored());
const HAS_OWNER = DATA.concat(COMPLETED).some(r => r.owner && String(r.owner).trim());

// Report day
const GEN = (function () {
  const t = Date.parse(META.generated || '');
  const d = isNaN(t) ? new Date() : new Date(t);
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(META.generated || '');
  return { time: isNaN(t) ? null : d, y: m ? +m[1] : d.getFullYear(), mo: m ? +m[2] - 1 : d.getMonth(), d: m ? +m[3] : d.getDate() };
})();
const dayFromGen = n => new Date(GEN.y, GEN.mo, GEN.d + n);
const pad = n => (n < 10 ? '0' : '') + n;
const fmtShort = d => d.getDate() + ' ' + MON[d.getMonth()];
function fmtStamp(d) {
  if (!d) return '';
  const y = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
  return fmtShort(d) + y + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function inDays(n) {
  if (n === null || n === undefined) return '';
  if (n < 0) return Math.abs(n) + (n === -1 ? ' day ago' : ' days ago');
  if (n === 0) return 'today';
  return 'in ' + n + (n === 1 ? ' day' : ' days');
}
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

function badge(u) {
  return '<span class="badge ' + esc(u) + '">' + glyph(u) + esc(URG_LABEL[u] || u) + '</span>';
}
function statusBadge(s) {
  const k = String(s || '').toLowerCase();
  return '<span class="badge plain st-' + esc(k) + '">' + esc(s || DASH) + '</span>';
}
// Card hints
function cardHints(base) {
  const uniq = arr => Array.from(new Set(arr.filter(v => v !== undefined && v !== null)));
  const t1 = uniq(base.map(r => (r.allTriggers || [])[0]));
  const t2 = uniq(base.map(r => (r.allTriggers || [])[1]));
  const one = t1.length === 1 ? t1[0] : null, two = t2.length === 1 ? t2[0] : null;
  const range = a => Math.min.apply(null, a) + '–' + Math.max.apply(null, a);
  return {
    expired:  'Past the expiry date',
    critical: one !== null ? 'Within ' + plural(one, 'day') : (t1.length ? 'Last alert window (' + range(t1) + ' days)' : 'Last alert window'),
    warning:  (one !== null && two !== null) ? (one + 1) + '–' + two + ' days left'
              : (t2.length ? 'Second alert window (' + range(t2) + ' days)' : 'Second alert window'),
    ok:       two !== null ? 'More than ' + plural(two, 'day') : 'Later'
  };
}

function searchBlob(r) {
  return [r.id, r.name, r.owner, r.servername, r.template, r.environment, r.action, r.status, r.severity,
          r.mailSender, r.mailSubject, (r.mailRecipients || []).join(' '), r.teamSubject].join(' ').toLowerCase();
}

function visibleRows() {
  const q = state.filter.trim().toLowerCase();
  let view = tabBase().slice();
  if (state.urgency) view = view.filter(r => r.urgency === state.urgency);
  if (q) view = view.filter(r => searchBlob(r).indexOf(q) >= 0);
  const k = state.sortKey, dir = state.sortDir;
  return view.sort((a, b) => {
    const x = a[k], y = b[k];
    const xe = x === null || x === undefined || x === '' || x === DASH;
    const ye = y === null || y === undefined || y === '' || y === DASH;
    if (xe && ye) return 0;
    if (xe) return 1;          // empty values always last
    if (ye) return -1;
    if (typeof x === 'number' && typeof y === 'number') return dir * (x - y);
    return dir * String(x).localeCompare(String(y), undefined, { numeric: true });
  });
}

// ------------------------------------------------------------------ header
function fact(label, value, sub) {
  return '<div class="fact"><div class="k">' + label + '</div><div class="v">' + value + '</div>' +
         (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
}

function fmtDay(ymd) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd || '');
  if (!m) return esc(ymd || '');
  return +m[3] + ' ' + MON[+m[2] - 1] + (+m[1] !== GEN.y ? ' ' + m[1] : '');
}
function daysFromReport(ymd) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd || '');
  if (!m) return null;
  return Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - dayFromGen(0)) / 86400000);
}
const fmtSent = t => (t ? fmtDay(t) + ' ' + t.slice(11, 16) : '');
const channelsOf = list => {
  const c = [];
  if (list.some(r => r.mailOn)) c.push('Mail');
  if (list.some(r => r.teamsOn)) c.push('Teams');
  return c.join(' + ');
};

function renderHeader() {
  const orgText = ORG || 'PsToDo';
  $('orgName').textContent = orgText;
  $('crumbOrg').textContent = orgText;
  document.title = (ORG ? ORG + ' · ' : '') + 'PsToDo - Calendar Reminder';
  $('sideFoot').textContent = META.version ? 'v' + META.version : '';
  $('printTitle').textContent = orgText + ' · Calendar Reminder';

  if (META.logo && /^data:image\//.test(META.logo)) {
    $('logoSlot').hidden = false;
    $('logoSlot').innerHTML = '<img alt="' + esc(orgText) + '" src="' + esc(META.logo) + '">';
  }

  const mon = monitored();
  const urgent = mon.filter(r => r.urgency === 'expired' || r.urgency === 'critical').length;
  $('navBadge').hidden = !urgent;
  $('navBadge').textContent = urgent;
  $('navBadge').title = plural(urgent, 'object') + ' expired or critical';

  const next = mon.filter(r => r.nextAlertDate).sort((a, b) => a.nextAlertDate.localeCompare(b.nextAlertDate));
  const first = next[0];
  const sameDay = first ? next.filter(r => r.nextAlertDate === first.nextAlertDate) : [];
  const rel = first ? daysFromReport(first.nextAlertDate) : null;
  const last = mon.concat(COMPLETED).filter(r => r.lastAlerted).sort((a, b) => b.lastAlerted.localeCompare(a.lastAlerted))[0];

  $('facts1').innerHTML = fact('Objects', mon.length + ' monitored', plural(COMPLETED.length, 'completed', 'completed'));
  $('facts2').innerHTML = fact('Next alert', first ? fmtDay(first.nextAlertDate) + ' · ' + esc(channelsOf(sameDay)) : 'None scheduled',
                               first ? plural(sameDay.length, 'object') + ' · ' + (rel <= 0 ? 'today' : inDays(rel)) : '');
  $('facts3').innerHTML = fact('Last alerted', last ? fmtSent(last.lastAlerted) : 'Never',
                               last ? '<span class="ell" style="display:block" title="' + esc(last.name) + '">' + esc(last.name) + '</span>' : '');
  $('facts4').innerHTML = fact('Report updated', GEN.time ? esc(fmtStamp(GEN.time)) : DASH, '');

  const issues = [[noChannelRows().length, 'without channel', 'nochannel'], [INVALID.length, 'not monitored', 'notmonitored']].filter(x => x[0] > 0);
  $('attn').innerHTML = issues.length
    ? ICON.warn + issues.map(x => '<button data-tab="' + x[2] + '">' + x[0] + ' ' + x[1] + '</button>').join(' · ')
    : '';
}

function renderStale() {
  const box = $('stale');
  const hours = Number(META.staleAfterHours) > 0 ? Number(META.staleAfterHours) : 24;
  if (!GEN.time) { box.innerHTML = ''; return; }
  const age = (Date.now() - GEN.time.getTime()) / 3600000;
  if (age <= hours) { box.innerHTML = ''; return; }
  const ageText = age >= 48 ? Math.floor(age / 24) + ' days' : Math.floor(age) + ' hours';
  box.innerHTML = '<div class="banner bad" role="alert">' + ICON.warn +
    '<div><b>This report is ' + ageText + ' old</b> (updated ' + esc(fmtStamp(GEN.time)) + '). ' +
    'It should be rebuilt at least every ' + plural(hours, 'hour') + ', so the scheduled run has probably stopped. ' +
    'Check the scheduled task on the server. Days left and alerts below are as of the last run.</div></div>';
}

function renderTabs() {
  const counts = { monitored: monitored().length, completed: COMPLETED.length, nochannel: noChannelRows().length,
                   noncred: NONCRED.length, notmonitored: INVALID.length };
  $('tabs').innerHTML = TABS.filter(t => !t.editor || CAN_EDIT).map(t =>
    '<button class="tab' + (state.tab === t.key ? ' active' : '') + '" role="tab" aria-selected="' + (state.tab === t.key) +
    '" data-tab="' + t.key + '">' + t.label + (t.key in counts ? '<span class="c">' + counts[t.key] + '</span>' : '') + '</button>'
  ).join('');
  const cur = TABS.filter(t => t.key === state.tab)[0];
  $('crumbView').textContent = cur ? cur.label : '';
  $('printMeta').textContent = (cur ? cur.label : '') + ' · updated ' + (GEN.time ? fmtStamp(GEN.time) : DASH);
  const navKey = ['overview', 'completed', 'edit'].indexOf(state.tab) >= 0 ? state.tab : 'monitored';
  document.querySelectorAll('#nav .nav-item[data-go]').forEach(n => n.classList.toggle('active', n.getAttribute('data-go') === navKey));
}

function renderCards() {
  const base = tabBase();
  const hints = cardHints(base);
  const filtering = state.tab !== 'overview';
  $('cards').innerHTML = URGENCY.map(u => {
    const n = base.filter(r => r.urgency === u.key).length;
    const on = filtering && state.urgency === u.key;
    return '<button class="kpi' + (on ? ' active' : '') + '" style="--bar:' + u.bar + ';--num:var(--x-' + u.key + ')" data-u="' + u.key +
      '" aria-pressed="' + on + '" title="Show the ' + u.label.toLowerCase() + ' objects">' +
      '<div class="n">' + n + '</div><div class="l">' + u.label + '</div><div class="h">' + esc(hints[u.key]) + '</div></button>';
  }).join('');
}

// ------------------------------------------------------------------ timeline
function renderTimeline(view) {
  const wrap = $('tlWrap');
  $('tlTitle').textContent = 'Expires in the next ' + TL_DAYS + ' days';
  $('tlMenu').innerHTML = TL_OPTIONS.map(d => '<button type="button" role="option" data-days="' + d + '" aria-selected="' + (d === TL_DAYS) + '">' + d + ' days</button>').join('') +
    '<div class="hint">Or type 1–3650 and press Enter</div>';
  $('tlCombo').classList.remove('bad');
  if (document.activeElement !== $('tlDaysInput')) { $('tlDaysInput').value = TL_DAYS; $('tlUnit').hidden = false; }
  $('timeline').classList.toggle('collapsed', TL_COLLAPSED);
  $('tlToggle').setAttribute('aria-expanded', String(!TL_COLLAPSED));
  $('tlToggle').title = TL_COLLAPSED ? 'Show the timeline' : 'Hide the timeline';
  const dated = view.filter(r => typeof r.daysLeft === 'number');
  const byDays = (a, b) => a.daysLeft - b.daysLeft || String(a.name).localeCompare(String(b.name));
  const allExpired = dated.filter(r => r.daysLeft < 0).sort(byDays);
  const inWindow = dated.filter(r => r.daysLeft >= 0 && r.daysLeft <= TL_DAYS);
  const counts = { expired: allExpired.length };
  ['critical', 'warning', 'ok'].forEach(k => { counts[k] = inWindow.filter(r => r.urgency === k).length; });
  const expiredRows = TL_SHOW.expired ? allExpired : [];
  const inRange = inWindow.filter(r => TL_SHOW[r.urgency] !== false).sort(byDays);
  const later = dated.filter(r => r.daysLeft > TL_DAYS && TL_SHOW[r.urgency] !== false).length;
  $('tlCount').textContent = plural(inRange.length + expiredRows.length, 'object');

  $('legend').innerHTML = URGENCY.map(u =>
    '<button class="sw" role="switch" data-sw="' + u.key + '" aria-checked="' + (TL_SHOW[u.key] !== false) + '" title="' +
      (TL_SHOW[u.key] !== false ? 'Hide ' : 'Show ') + u.label.toLowerCase() + ' objects on the timeline">' +
      '<span class="track"><span class="knob"></span></span><span class="lg-dot ' + u.key + '"></span>' + u.label +
      '<span class="n">' + counts[u.key] + '</span></button>').join('') +
    (later && TL_SHOW.expired !== false ? '<span class="later">' + later + ' later than ' + TL_DAYS + ' days</span>' : '');

  if (!inRange.length && !expiredRows.length) {
    const anyOn = Object.keys(TL_SHOW).some(k => TL_SHOW[k] !== false);
    wrap.innerHTML = '<div class="tl-empty">' + (anyOn ? 'Nothing to show for the next ' + TL_DAYS + ' days.' : 'Turn on a status below to see it on the timeline.') + '</div>';
    return;
  }

  const W = Math.max(300, wrap.clientWidth - 40);
  const G = 27, R = 7, padR = 20;
  // Expired lane left of Today
  const LANE = expiredRows.length ? 72 : 0;
  const padL = 20 + LANE;
  const span = W - padL - padR;
  const x = d => padL + (d / TL_DAYS) * span;

  // Stack overlapping markers
  const levels = [];
  const pts = inRange.map(r => {
    const px = x(r.daysLeft);
    let k = 0;
    while (levels[k] && levels[k].some(v => Math.abs(v - px) < 2 * R + 6)) k++;
    (levels[k] = levels[k] || []).push(px);
    return { r: r, px: px, k: k };
  });
  expiredRows.forEach((r, i) => pts.push({ r: r, px: 20 + 9 + (i % 3) * 18, k: Math.floor(i / 3) }));
  const rows = Math.max(2, levels.length, Math.ceil(expiredRows.length / 3));
  const top = 22;
  const plotH = top + rows * G;
  const H = plotH + 30;

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="' +
            esc(plural(inRange.length, 'object') + ' expire in the next ' + TL_DAYS + ' days' + (expiredRows.length ? ', ' + expiredRows.length + ' already expired' : '')) + '">';
  if (LANE) {
    svg += '<line class="tl-lane" x1="' + (padL - 10) + '" x2="' + (padL - 10) + '" y1="0" y2="' + plotH + '"/>';
    svg += '<text class="tl-label" x="20" y="' + (plotH + 22) + '">Expired</text>';
  }
  const perDay = span / TL_DAYS;
  // Grid: weeks up to 120 days, months up to 3 years, then years
  const ticks = [];
  if (TL_DAYS <= 120) {
    for (let d = 7; d <= TL_DAYS; d += 7) ticks.push({ d: d, label: fmtShort(dayFromGen(d)) });
  } else if (TL_DAYS > 1095) {
    for (let y = GEN.y + 1; ; y++) {
      const d = Math.round((new Date(y, 0, 1) - dayFromGen(0)) / 86400000);
      if (d > TL_DAYS) break;
      ticks.push({ d: d, label: String(y) });
    }
  } else {
    for (let m = 1; ; m++) {
      const first = new Date(GEN.y, GEN.mo + m, 1);
      const d = Math.round((first - dayFromGen(0)) / 86400000);
      if (d > TL_DAYS) break;
      ticks.push({ d: d, label: MON[first.getMonth()] + (first.getMonth() === 0 ? ' ' + first.getFullYear() : '') });
    }
  }
  const step = ticks.length > 1 ? (ticks[1].d - ticks[0].d) * perDay : span;
  const labelEvery = Math.max(1, Math.ceil(56 / step));
  ticks.forEach((t, i) => {
    const gx = x(t.d);
    svg += '<line class="tl-grid" x1="' + gx + '" x2="' + gx + '" y1="0" y2="' + plotH + '"/>';
    if ((i + 1) % labelEvery === 0 && gx < W - 20 && gx > x(0) + 34) {
      svg += '<text class="tl-label" x="' + gx + '" y="' + (plotH + 22) + '" text-anchor="middle">' + t.label + '</text>';
    }
  });
  const sameDay = !GEN.time || new Date().toDateString() === dayFromGen(0).toDateString();
  svg += '<line class="tl-today" x1="' + x(0) + '" x2="' + x(0) + '" y1="0" y2="' + plotH + '"/>';
  svg += '<text class="tl-today-label" x="' + x(0) + '" y="' + (plotH + 22) + '" text-anchor="middle">' + (sameDay ? 'Today' : 'Report day') + '</text>';

  pts.forEach((p, i) => {
    const r = p.r, cy = top + p.k * G;
    svg += '<g class="mk" tabindex="0" role="button" data-i="' + i + '" aria-label="' +
           esc(r.name + ', ' + (URG_LABEL[r.urgency] || r.urgency) + ', expires ' + r.expireDate) + '">' +
           '<circle class="dot ' + esc(r.urgency) + '" cx="' + p.px.toFixed(1) + '" cy="' + cy + '" r="' + R + '"/>' +
           '<circle class="hit" cx="' + p.px.toFixed(1) + '" cy="' + cy + '" r="13"/></g>';
  });
  svg += '</svg><div class="tip" id="tip" hidden></div>';
  wrap.innerHTML = svg;

  const tip = $('tip');
  const show = el => {
    const p = pts[+el.getAttribute('data-i')];
    if (!p) return;
    const r = p.r;
    tip.innerHTML = '<b>' + esc(r.name) + '</b>' +
      '<div>' + glyph(r.urgency) + ' ' + esc(URG_LABEL[r.urgency] || r.urgency) + ' · ' + (r.daysLeft < 0 ? 'expired ' : 'expires ') + fmtDay(r.expireDate) + ' (' + inDays(r.daysLeft) + ')</div>' +
      '<div class="row2">Next alert: ' + (r.nextAlertDate ? (r.nextAlertDue ? 'next run' : fmtDay(r.nextAlertDate)) + ' · ' + esc(r.nextAlertChannel) : (r.mailOn || r.teamsOn ? DASH : 'no channel')) + '</div>' +
      (r.owner ? '<div class="row2">Owner: ' + esc(r.owner) + '</div>' : '');
    tip.hidden = false;
    const scale = wrap.querySelector('svg').getBoundingClientRect().width / W;
    let left = 20 + p.px * scale;
    const half = tip.offsetWidth / 2;
    left = Math.min(Math.max(left, half + 4), wrap.clientWidth - half - 4);
    tip.style.left = left + 'px';
    tip.style.top = (18 + (top + p.k * G - 12) * scale) + 'px';
  };
  const hide = () => { tip.hidden = true; };
  wrap.querySelectorAll('.mk').forEach(el => {
    el.addEventListener('pointerenter', () => show(el));
    el.addEventListener('pointerleave', hide);
    el.addEventListener('focus', () => show(el));
    el.addEventListener('blur', hide);
    const go = () => { const p = pts[+el.getAttribute('data-i')]; if (p) jumpToRow(p.r.id); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

// ------------------------------------------------------------------ overview feeds
function renderFeeds() {
  const MAX = 8;
  const upcoming = monitored().filter(r => r.nextAlertDate)
    .sort((a, b) => a.nextAlertDate.localeCompare(b.nextAlertDate) || String(a.name).localeCompare(String(b.name)));
  $('showAll').hidden = upcoming.length <= MAX;
  $('upcoming').innerHTML = upcoming.length ? upcoming.slice(0, MAX).map(r => {
    const rel = daysFromReport(r.nextAlertDate);
    const today = r.nextAlertDue || rel <= 0;
    return '<li><span class="ico' + (today ? ' today' : '') + '">' + (today ? ICON.bell : ICON.cal) + '</span><div>' +
      '<div class="meta">' + fmtDay(r.nextAlertDate) + ' · ' + (today ? 'today' : inDays(rel)) + ' · ' + esc(r.nextAlertChannel) + '</div>' +
      '<div class="txt"><button class="obj" data-id="' + esc(r.id) + '">' + esc(r.name) + '</button> – ' + esc(r.nextAlertLabel) + '</div></div></li>';
  }).join('') : '<li class="empty">No alerts scheduled.</li>';

  const sent = [];
  monitored().concat(COMPLETED).forEach(r => (r.windows || []).forEach(w => {
    if (w.sentAt) sent.push({ r: r, at: w.sentAt, label: w.kind === 'reminder' ? 'Expired reminder' : w.label });
  }));
  sent.sort((a, b) => b.at.localeCompare(a.at));
  $('recent').innerHTML = sent.length ? sent.slice(0, MAX).map(e =>
    '<li><span class="ico sent">' + (e.r.mailOn || !e.r.teamsOn ? ICON.mail : ICON.teams) + '</span><div>' +
      '<div class="meta">' + fmtSent(e.at) + '</div>' +
      '<div class="txt">Alert sent: <button class="obj" data-id="' + esc(e.r.id) + '"' + (isCompleted(e.r) ? ' data-completed="1"' : '') + '>' + esc(e.r.name) + '</button> – ' + esc(e.label) + '</div></div></li>'
  ).join('') : '<li class="empty">No alerts have been sent yet.</li>';
}

function jumpToRow(id, completed) {
  state.tab = completed ? 'completed' : 'monitored';
  state.urgency = null;
  state.filter = '';
  $('filter').value = '';
  openRows.add(id);
  render();
  const rows = document.querySelectorAll('#mount tr.row');
  for (let i = 0; i < rows.length; i++) {
    if (rows[i].getAttribute('data-id') === String(id)) {
      rows[i].scrollIntoView({ block: 'center' });
      rows[i].classList.add('flash');
      rows[i].focus({ preventScroll: true });
      break;
    }
  }
}

// ------------------------------------------------------------------ main table
function daysCell(n) {
  if (n === null || n === undefined) return '<span class="muted">' + DASH + '</span>';
  const label = n < 0 ? 'expired ' + inDays(n) : (n === 0 ? 'expires today' : inDays(n));
  return '<span title="' + label + '">' + (n < 0 ? MINUS + Math.abs(n) : n) + '</span>';
}
function nextCell(r) {
  if (!r.nextAlertDate) {
    if (r.urgency === 'none') return '<span class="muted">' + DASH + '</span>';
    return (r.mailOn || r.teamsOn) ? '<span class="muted">' + DASH + '</span>'
                                   : '<span class="muted">' + glyph('warning') + ' No channel</span>';
  }
  const top = r.nextAlertDue ? '<span class="due" title="Goes out on the next run of the alert script">Next run</span>' : esc(r.nextAlertDate);
  return '<div>' + top + '</div><div class="sub ell" title="' + esc(r.nextAlertLabel + ' · ' + r.nextAlertChannel) + '">' +
         esc(r.nextAlertLabel) + ' · ' + esc(r.nextAlertChannel) + '</div>';
}
function lastCell(r) {
  if (!r.lastAlerted) return '<span class="muted">Never</span>';
  return '<div>' + esc(r.lastAlerted) + '</div><div class="sub ell">' + esc(r.lastAlertedLabel) + '</div>';
}

function mainCols() {
  const cols = [
    { k: '',               label: '',             w: 30 },
    { k: 'id',             label: 'Id',           w: 46,  cls: 'id' },
    { k: 'name',           label: 'Name',         w: null, cls: 'name' },
    { k: 'owner',          label: 'Owner',        w: 124, owner: true },
    { k: 'servername',     label: 'Target',       w: 184 },
    { k: 'expireDate',     label: 'Expires',      w: 96,  cls: 'num' },
    { k: 'daysLeft',       label: 'Days',         w: 68,  cls: 'num' },
    { k: 'nextAlertDate',  label: 'Next alert',   w: 166 },
    { k: 'lastAlerted',    label: 'Last alerted', w: 144 },
    { k: 'urgency',        label: 'Urgency',      w: 104 },
    { k: 'status',         label: 'Status',       w: 92 }
  ];
  return cols.filter(c => !c.owner || HAS_OWNER);
}

function cell(c, r) {
  switch (c.k) {
    case '':              return '<span class="chev">' + ICON.chev + '</span>';
    case 'id':            return esc(r.id);
    case 'name':          return '<div class="ell" title="' + esc(r.name) + '">' + esc(r.name) + '</div>';
    case 'owner':         return r.owner ? '<div class="ell" title="' + esc(r.owner) + '">' + esc(r.owner) + '</div>' : '<span class="muted">' + DASH + '</span>';
    case 'servername':    return '<div class="ell" title="' + esc(r.servername) + '">' + (esc(r.servername) || DASH) + '</div>' +
                                 (r.environment ? '<div class="sub ell" title="' + esc(r.environment) + '">' + esc(r.environment) + '</div>' : '');
    case 'expireDate':    return esc(r.expireDate);
    case 'daysLeft':      return daysCell(r.daysLeft);
    case 'nextAlertDate': return nextCell(r);
    case 'lastAlerted':   return lastCell(r);
    case 'urgency':       return badge(r.urgency);
    case 'status':        return statusBadge(r.status);
  }
  return '';
}

function headHtml(cols, sortable) {
  return '<colgroup>' + cols.map(c => '<col' + (c.w ? ' style="width:' + c.w + 'px"' : '') + '>').join('') + '</colgroup>' +
    '<thead><tr>' + cols.map(c => {
      if (!c.k || !sortable) return '<th class="' + (c.cls || '') + '">' + c.label + '</th>';
      const arrow = state.sortKey === c.k ? '<span class="arrow">' + (state.sortDir === 1 ? '&#9650;' : '&#9660;') + '</span>' : '';
      return '<th class="sort' + (c.cls === 'num' ? ' num' : '') + '" data-k="' + c.k + '" aria-sort="' +
             (state.sortKey === c.k ? (state.sortDir === 1 ? 'ascending' : 'descending') : 'none') + '">' + c.label + arrow + '</th>';
    }).join('') + '</tr></thead>';
}

function windowText(w) {
  switch (w.status) {
    case 'sent':      return { cls: 'sent', icon: ICON.check, text: 'Sent ✓ ' + w.sentAt };
    case 'due':       return { cls: 'due', icon: ICON.send, text: 'Due · goes out on the next run' };
    case 'upcoming':  return { cls: 'upcoming', icon: ICON.clock, text: (w.kind === 'reminder' ? 'Next on ' : 'Pending · opens ') + w.opens };
    case 'nochannel': return { cls: 'nochannel', icon: ICON.warn, text: 'Open, but no channel is enabled' };
    default:          return { cls: 'missed', icon: ICON.dash, text: w.kind === 'expiry' ? 'Not sent' : 'Not sent · window closed ' + (w.closes || '') };
  }
}

function feedHtml(r) {
  const ws = (r.windows || []).slice();
  if (!ws.length) return '<div class="empty">No alert schedule (no valid expiry date or triggers).</div>';
  ws.sort((a, b) => (b.kind === 'window' ? b.trigger : -1) - (a.kind === 'window' ? a.trigger : -1));
  const items = ws.filter(w => !(w.kind === 'reminder' && r.daysLeft >= 0 && !w.sentAt)).map(w => {
    const t = windowText(w);
    let when = w.kind === 'window' ? w.opens + ' → ' + w.closes : w.opens;
    if (w.kind === 'reminder') when = 'Every ' + (META.expiredNotifyDays || 7) + ' days after expiry';
    let extra = '';
    if (w.kind === 'reminder' && w.sentAt) extra = '<div class="when">Last sent ' + esc(w.sentAt) + '</div>';
    const text = (w.kind === 'reminder' && w.status === 'sent') ? 'Sent ✓ ' + w.sentAt : t.text;
    const lvl = w.kind === 'window' ? '<span class="lvl">' + esc(w.level) + '</span>' : '';
    const label = w.kind === 'reminder' ? 'Expired reminder' : w.label;
    return '<li><span class="ico ' + t.cls + '">' + t.icon + '</span><div>' +
           '<div class="when">' + esc(when) + '</div>' +
           '<div class="what">' + esc(label) + lvl + '</div>' +
           '<div class="state ' + t.cls + '">' + esc(text) + '</div>' + extra + '</div></li>';
  });
  return '<ul class="feed">' + items.join('') + '</ul>';
}

function detailHtml(r, span) {
  const kv = pairs => '<dl class="kv">' + pairs.filter(p => p[1] !== null && p[1] !== undefined && p[1] !== '')
                         .map(p => '<dt>' + p[0] + '</dt><dd>' + p[1] + '</dd>').join('') + '</dl>';
  const recipients = (r.mailRecipients || []).filter(Boolean);
  const editLink = CAN_EDIT ? '<a href="#" class="edit-obj" data-id="' + esc(r.id) + '">' + ICON.edit + 'Edit</a>' : '';

  const about = '<div class="box"><div class="box-head"><span>About this object</span>' + editLink + '</div>' +
    kv([
      ['Owner', r.owner ? esc(r.owner) : '<span class="muted">Not set</span>'],
      ['Target', esc(r.servername)],
      ['Environment', esc(r.environment)],
      ['Template', esc(r.template)],
      ['Status', statusBadge(r.status) + (r.copiedDate ? ' <span class="muted">since ' + esc(r.copiedDate) + '</span>' : '')],
      ['Severity', r.severity ? '<span class="badge plain sev-' + esc(String(r.severity).toLowerCase()) + '">' + esc(r.severity) + '</span>' : ''],
      ['App ID', r.appId ? '<span class="mono">' + esc(r.appId) + '</span>' : ''],
      ['Message ID', r.messageId ? '<span class="mono">' + esc(r.messageId) + '</span>' : ''],
      ['Link', /^https:\/\//i.test(r.messageLink || '') ? '<a href="' + esc(r.messageLink) + '" target="_blank" rel="noopener">Open in admin center</a>' : ''],
      ['Triggers', (r.allTriggers || []).length ? esc((r.allTriggers || []).join(', ')) + ' days' : '']
    ]) +
    (r.action ? '<div class="desc"><div class="k">Action required</div>' + esc(r.action) + '</div>' : '') + '</div>';

  const schedule = '<div class="box"><div class="box-head light"><span>Alert schedule</span>' +
    '<span class="muted" style="font-weight:400;font-size:12px">' + (r.lastAlerted ? 'Last sent ' + esc(r.lastAlerted) : 'Nothing sent yet') + '</span></div>' +
    feedHtml(r) + '</div>';

  const mail = '<div class="' + (r.mailOn ? '' : 'off-block') + '"><div class="subhead">' + ICON.mail + 'Mail <span class="onoff' + (r.mailOn ? ' on' : '') + '">' + (r.mailOn ? 'On' : 'Off') + '</span></div>' +
    kv([
      ['Sender', esc(r.mailSender) || '<span class="muted">' + DASH + '</span>'],
      ['Recipients', recipients.length ? recipients.map(esc).join('<br>') : '<span class="muted">None</span>'],
      ['Subject', esc(r.mailSubject)],
      ['Body', esc(r.mailBody)]
    ]) + '</div>';
  const teams = '<div class="' + (r.teamsOn ? '' : 'off-block') + '"><div class="subhead">' + ICON.teams + 'Teams <span class="onoff' + (r.teamsOn ? ' on' : '') + '">' + (r.teamsOn ? 'On' : 'Off') + '</span></div>' +
    kv([
      ['Webhook', r.teamWebhook ? '<span class="mono" title="Shortened - the full address is only shown in the editor">' + esc(r.teamWebhook) + '</span>' : ''],
      ['Subject', esc(r.teamSubject)],
      ['Body', esc(r.teamBody)]
    ]) + '</div>';
  const channels = '<div class="box"><div class="box-head light"><span>Notifications</span></div>' + mail + teams + '</div>';

  return '<tr class="detail"><td colspan="' + span + '"><div class="detail-grid">' + about + schedule + channels + '</div></td></tr>';
}

function mainTableHtml(view) {
  const cols = mainCols();
  const body = view.map(r => {
    const isOpen = openRows.has(r.id);
    return '<tr class="row' + (isOpen ? ' open' : '') + '" tabindex="0" aria-expanded="' + isOpen + '" data-id="' + esc(r.id) + '">' +
      cols.map(c => '<td class="' + (c.cls || '') + '">' + cell(c, r) + '</td>').join('') + '</tr>' +
      (isOpen ? detailHtml(r, cols.length) : '');
  }).join('');
  return '<table class="grid' + (HAS_OWNER ? '' : ' no-owner') + '">' + headHtml(cols, true) + '<tbody>' + body + '</tbody></table>';
}

// ------------------------------------------------------------------ other tabs
function simpleTable(cols, rows, rowHtml) {
  return '<table class="grid small">' + headHtml(cols, false) + '<tbody>' + rows.map(rowHtml).join('') + '</tbody></table>';
}

function noChannelView() {
  const list = noChannelRows();
  $('notice').innerHTML = list.length ? '<div class="banner">' + ICON.warn + '<div>These objects have <b>no notification channel</b> - neither mail nor Teams - so they never alert, even when they expire. ' +
    'Set <b>notifyMethodbyMail</b> and/or <b>notifyMethodbyTeams</b> to <span class="mono">true</span> in monitorobjects.json' + (CAN_EDIT ? ' or in the <a href="#" class="edit-obj">editor</a>' : '') + '.</div></div>' : '';
  if (!list.length) return { html: '<div class="empty">Every monitored object has at least one notification channel enabled.</div>', n: 0 };
  const cols = [{ label: 'Id', w: 58 }, { label: 'Name' }, { label: 'Target', w: 220 }, { label: 'Environment', w: 200 },
                { label: 'Expires', w: 106, cls: 'num' }, { label: 'Status', w: 110 }];
  return { n: list.length, html: simpleTable(cols, list, o =>
    '<tr><td class="id">' + esc(o.id) + '</td><td class="name"><div class="ell" title="' + esc(o.name) + '">' + esc(o.name) + '</div></td>' +
    '<td><div class="ell">' + esc(o.servername) + '</div></td><td><div class="ell">' + esc(o.environment) + '</div></td>' +
    '<td class="num">' + esc(o.expireDate) + '</td><td>' + statusBadge(o.status) + '</td></tr>') };
}

function noCredsView() {
  $('notice').innerHTML = NONCRED.length ? '<div class="banner info"><div>App registrations with <b>no secret and no certificate</b>. Nothing expires, so they never alert - listed here for inventory. ' +
    'To check whether one is still used: copy its <b>App ID</b>, open Entra &rarr; <b>Enterprise applications</b>, search for the App ID, open the service principal and look at <b>Sign-in logs</b>. ' +
    'No recent sign-ins usually means it can be cleaned up.</div></div>' : '';
  if (!NONCRED.length) return { html: '<div class="empty">No app registrations without credentials.</div>', n: 0 };
  const cols = [{ label: 'Id', w: 58 }, { label: 'Name' }, { label: 'App ID', w: 310 }, { label: 'Environment', w: 300 }, { label: 'Status', w: 110 }];
  return { n: NONCRED.length, html: simpleTable(cols, NONCRED, o =>
    '<tr><td class="id">' + esc(o.id) + '</td><td class="name"><div class="ell" title="' + esc(o.name) + '">' + esc(o.name) + '</div>' +
    (o.description ? '<div class="sub ell" title="' + esc(o.description) + '">' + esc(o.description) + '</div>' : '') + '</td>' +
    '<td class="mono">' + esc(o.servername) + '</td><td><div class="ell" title="' + esc(o.environment) + '">' + esc(o.environment) + '</div></td>' +
    '<td>' + statusBadge(o.status) + '</td></tr>') };
}

function notMonitoredView() {
  $('notice').innerHTML = INVALID.length ? '<div class="banner bad">' + ICON.warn + '<div>These objects have no valid <b>expireDate</b> or no triggers, so they are <b>not monitored</b>. Fix them in monitorobjects.json' +
    (CAN_EDIT ? ' or in the <a href="#" class="edit-obj">editor</a>' : '') + ' to start monitoring.</div></div>' : '';
  if (!INVALID.length) return { html: '<div class="empty">Every object has a valid expiry date - nothing is unmonitored.</div>', n: 0 };
  const cols = [{ label: 'Id', w: 58 }, { label: 'Name' }, { label: 'Reason', w: 340 }];
  return { n: INVALID.length, html: simpleTable(cols, INVALID, o =>
    '<tr><td class="id">' + esc(o.id) + '</td><td class="name"><div class="ell" title="' + esc(o.name) + '">' + esc(o.name) + '</div></td><td>' + esc(o.reason) + '</td></tr>') };
}

// ------------------------------------------------------------------ render
function render() {
  renderTabs();
  const t = state.tab;
  const onTable = t === 'monitored' || t === 'completed';
  const show = (id, on) => { $(id).style.display = on ? '' : 'none'; };
  show('cards', onTable || t === 'overview');
  show('toolbar', onTable);
  show('timeline', t === 'overview');
  show('feeds', t === 'overview');
  show('objects', t !== 'overview' && t !== 'edit');
  show('editor', t === 'edit');

  if (t === 'edit') {
    $('notice').innerHTML = '';
    showEditor();
    return;
  }

  if (t === 'overview') {
    $('notice').innerHTML = '';
    renderCards();
    renderTimeline(monitored());
    renderFeeds();
    return;
  }

  if (!onTable) {
    const v = t === 'nochannel' ? noChannelView() : t === 'noncred' ? noCredsView() : notMonitoredView();
    const titles = { nochannel: 'Objects without a notification channel', noncred: 'App registrations without credentials', notmonitored: 'Objects that are not monitored' };
    $('tableTitle').textContent = titles[t];
    $('count').textContent = plural(v.n, 'object');
    $('mount').innerHTML = v.html;
    return;
  }

  renderCards();
  $('notice').innerHTML = t === 'completed'
    ? '<div class="banner info"><div>This tab is built from <b>' + esc(META.completeSource || 'MonitorObjectComplete.json') + '</b>. ' +
      'Objects with status <b>Completed</b> are copied there from monitorobjects.json each time the report runs.</div></div>'
    : '';
  $('tableTitle').textContent = t === 'completed' ? 'Completed objects' : 'Monitored objects';

  const view = visibleRows();
  const total = tabBase().length;
  $('count').textContent = view.length === total ? plural(total, 'object') : view.length + ' of ' + plural(total, 'object');
  $('mount').innerHTML = view.length ? mainTableHtml(view)
    : '<div class="empty">' + (total ? 'No objects match the current filter.' : (t === 'completed' ? 'No completed objects yet.' : 'No monitored objects.')) + '</div>';
}

// ------------------------------------------------------------------ CSV
function csvRows() {
  const list = state.tab === 'nochannel' ? noChannelRows() : state.tab === 'noncred' ? NONCRED : state.tab === 'notmonitored' ? INVALID : visibleRows();
  if (state.tab === 'noncred') return [['Id', 'Name', 'App ID', 'Environment', 'Status', 'Template', 'Description']]
    .concat(list.map(o => [o.id, o.name, o.servername, o.environment, o.status, o.template, o.description]));
  if (state.tab === 'notmonitored') return [['Id', 'Name', 'Reason']].concat(list.map(o => [o.id, o.name, o.reason]));
  const head = ['Id', 'Name', 'Owner', 'Target', 'Environment', 'Template', 'Expires', 'Days left', 'Urgency', 'Status',
                'Next alert', 'Next alert window', 'Channels', 'Last alerted', 'Last alert window', 'Mail', 'Teams', 'Recipients', 'Action required'];
  if (state.tab === 'completed') head.push('Completed since');
  return [head].concat(list.map(r => {
    const row = [r.id, r.name, r.owner, r.servername, r.environment, r.template, r.expireDate, r.daysLeft, URG_LABEL[r.urgency] || r.urgency, r.status,
      r.nextAlertDate ? (r.nextAlertDue ? 'next run' : r.nextAlertDate) : '', r.nextAlertLabel, r.nextAlertChannel,
      r.lastAlerted, r.lastAlertedLabel, r.mailOn ? 'on' : 'off', r.teamsOn ? 'on' : 'off', (r.mailRecipients || []).join(', '), r.action];
    if (state.tab === 'completed') row.push(r.copiedDate);
    return row;
  }));
}

function exportCsv() {
  // ; when the decimal separator is a comma (Excel)
  const sep = (1.5).toLocaleString().indexOf(',') >= 0 ? ';' : ',';
  const q = v => {
    if (v === null || v === undefined) return '""';
    let s = String(v);
    if (typeof v !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;   // no formulas in Excel
    return '"' + s.replace(/"/g, '""') + '"';
  };
  const text = csvRows().map(row => row.map(q).join(sep)).join('\r\n');
  const blob = new Blob([String.fromCharCode(0xFEFF) + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'psToDo-' + (state.tab === 'overview' || state.tab === 'edit' ? 'monitored' : state.tab) + '-' + GEN.y + '-' + pad(GEN.mo + 1) + '-' + pad(GEN.d) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// ------------------------------------------------------------------ events
function setTab(t) { state.tab = t; state.urgency = null; render(); window.scrollTo(0, 0); }

$('filter').addEventListener('input', e => { state.filter = e.target.value; render(); });
$('export').addEventListener('click', exportCsv);
$('print').addEventListener('click', () => window.print());
$('reset').addEventListener('click', () => {
  state = Object.assign({}, DEFAULTS, { tab: state.tab });
  openRows.clear();
  $('filter').value = '';
  render();
});
$('menu').addEventListener('click', () => {
  const app = $('app');
  if (window.matchMedia('(max-width: 900px)').matches) app.classList.toggle('nav-open');
  else app.classList.toggle('nav-hidden');
});
$('tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) setTab(t.getAttribute('data-tab')); });
$('attn').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.getAttribute('data-tab')); });
$('cards').addEventListener('click', e => {
  const c = e.target.closest('.kpi'); if (!c) return;
  const u = c.getAttribute('data-u');
  if (state.tab === 'overview') { state.tab = 'monitored'; state.urgency = u; render(); window.scrollTo(0, 0); return; }
  state.urgency = state.urgency === u ? null : u;
  render();
});
// Days combo box
const tlInput = $('tlDaysInput'), tlMenu = $('tlMenu');
function setDays(n) {
  TL_DAYS = n;
  store.set('tlDays', n);
  tlInput.value = n;
  $('tlUnit').hidden = false;
  closeDaysMenu();
  tlInput.blur();
  renderTimeline(monitored());
}
function openDaysMenu(focusFirst) {
  tlMenu.hidden = false;
  tlInput.setAttribute('aria-expanded', 'true');
  if (focusFirst) { const b = tlMenu.querySelector('button[aria-selected="true"]') || tlMenu.querySelector('button'); if (b) b.focus(); }
}
function closeDaysMenu() { tlMenu.hidden = true; tlInput.setAttribute('aria-expanded', 'false'); }
function applyOwnDays() {
  if (tlInput.value.trim() === '') { tlInput.value = TL_DAYS; $('tlUnit').hidden = false; return; }
  const n = validDays(tlInput.value.trim());
  if (!n) { $('tlCombo').classList.add('bad'); $('tlCombo').title = 'Use a whole number from 1 to ' + TL_MAX; return; }
  setDays(n);
}
tlInput.addEventListener('focus', () => { tlInput.select(); openDaysMenu(false); });
tlInput.addEventListener('input', () => { tlInput.value = tlInput.value.replace(/[^0-9]/g, ''); $('tlUnit').hidden = tlInput.value === ''; $('tlCombo').classList.remove('bad'); });
tlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); applyOwnDays(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); openDaysMenu(true); }
  else if (e.key === 'Escape') { tlInput.value = TL_DAYS; $('tlUnit').hidden = false; closeDaysMenu(); tlInput.blur(); }
});
$('tlCaret').addEventListener('mousedown', e => e.preventDefault());
$('tlCaret').addEventListener('click', () => { if (tlMenu.hidden) { tlInput.focus(); } else { closeDaysMenu(); } });
tlMenu.addEventListener('mousedown', e => e.preventDefault());
tlMenu.addEventListener('click', e => { const b = e.target.closest('button[data-days]'); if (b) setDays(Number(b.getAttribute('data-days'))); });
tlMenu.addEventListener('keydown', e => {
  const items = Array.from(tlMenu.querySelectorAll('button[data-days]'));
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(items.length - 1, i + 1)].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (i <= 0) tlInput.focus(); else items[i - 1].focus(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeDaysMenu(); tlInput.focus(); }
});
document.addEventListener('mousedown', e => {
  if (!tlMenu.hidden && !$('tlCombo').contains(e.target)) closeDaysMenu();
});
$('tlCombo').addEventListener('focusout', e => {
  if (!$('tlCombo').contains(e.relatedTarget)) {
    closeDaysMenu();
    if (tlInput.value.trim() !== '' && tlInput.value.trim() !== String(TL_DAYS)) applyOwnDays();
    else { tlInput.value = TL_DAYS; $('tlUnit').hidden = false; }
  }
});
$('tlToggle').addEventListener('click', () => {
  TL_COLLAPSED = !TL_COLLAPSED;
  store.set('tlCollapsed', TL_COLLAPSED ? '1' : '0');
  renderTimeline(monitored());
});
$('legend').addEventListener('click', e => {
  const b = e.target.closest('.sw[data-sw]'); if (!b) return;
  const k = b.getAttribute('data-sw');
  TL_SHOW[k] = TL_SHOW[k] === false;
  store.set('tlShow', JSON.stringify(TL_SHOW));
  renderTimeline(monitored());
  const again = $('legend').querySelector('.sw[data-sw="' + k + '"]'); if (again) again.focus();
});
$('feeds').addEventListener('click', e => {
  const b = e.target.closest('.obj'); if (b) jumpToRow(b.getAttribute('data-id'), b.hasAttribute('data-completed'));
});
$('showAll').addEventListener('click', () => {
  state = Object.assign({}, DEFAULTS, { tab: 'monitored', sortKey: 'nextAlertDate', sortDir: 1 });
  $('filter').value = '';
  render(); window.scrollTo(0, 0);
});
document.querySelector('.side').addEventListener('click', e => {
  const a = e.target.closest('[data-go]'); if (!a) return;
  e.preventDefault();
  setTab(a.getAttribute('data-go'));
  $('app').classList.remove('nav-open');
});

const mount = $('mount');
function toggleRow(tr) {
  const id = tr.getAttribute('data-id');
  if (openRows.has(id)) openRows.delete(id); else openRows.add(id);
  render();
  const again = mount.querySelector('tr.row[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
  if (again) again.focus({ preventScroll: true });
}
mount.addEventListener('click', e => {
  const th = e.target.closest('th.sort');
  if (th) {
    const k = th.getAttribute('data-k');
    state.sortDir = k === state.sortKey ? -state.sortDir : 1;
    state.sortKey = k;
    render();
    return;
  }
  if (e.target.closest('tr.detail')) return;
  const tr = e.target.closest('tr.row[data-id]');
  if (tr) toggleRow(tr);
});
mount.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const tr = e.target.closest('tr.row[data-id]');
  if (tr && e.target === tr) { e.preventDefault(); toggleRow(tr); }
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state.tab === 'overview') renderTimeline(monitored()); }, 120);
});
window.addEventListener('beforeprint', () => { if (state.tab === 'overview') renderTimeline(monitored()); });

function enableEditing() {
  CAN_EDIT = true;
  $('navEditor').hidden = false; $('navSep').hidden = false;
  $('actEdit').hidden = false;
  render();
}

// Editor in an iframe, loaded once and kept
let editFrame = null, pendingFocus = null;
function showEditor() {
  if (!editFrame) {
    editFrame = document.createElement('iframe');
    editFrame.title = 'Edit objects';
    editFrame.src = EDITOR;
    editFrame.addEventListener('load', () => {
      postToEditor({ type: 'psToDo-theme', theme: document.documentElement.getAttribute('data-theme') || '' });
      if (pendingFocus) { postToEditor({ type: 'psToDo-focus', id: pendingFocus }); pendingFocus = null; }
    });
    $('editorMount').appendChild(editFrame);
  }
  sizeEditor();
}
function sizeEditor() {
  if (!editFrame || state.tab !== 'edit') return;
  const top = editFrame.getBoundingClientRect().top + window.scrollY;
  editFrame.style.height = Math.max(480, window.innerHeight - (top - window.scrollY) - 24) + 'px';
}
function postToEditor(msg) {
  try { if (editFrame && editFrame.contentWindow) editFrame.contentWindow.postMessage(msg, location.origin === 'null' ? '*' : location.origin); } catch (e) { }
}
function openEditor(id) {
  if (!CAN_EDIT) return;
  const fresh = !editFrame;
  setTab('edit');
  if (id === undefined || id === null) return;
  if (fresh) pendingFocus = id; else postToEditor({ type: 'psToDo-focus', id: id });
}
document.addEventListener('click', e => {
  const a = e.target.closest('.edit-obj');
  if (!a) return;
  e.preventDefault();
  openEditor(a.getAttribute('data-id'));
});
$('actEdit').addEventListener('click', () => openEditor());
window.addEventListener('resize', sizeEditor);

// Theme
const MOON = '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const SUN = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
function effectiveTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  const dark = effectiveTheme() === 'dark';
  $('themeBtn').innerHTML = dark ? SUN : MOON;
  $('themeBtn').title = dark ? 'Light theme' : 'Dark theme';
  $('themeBtn').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
$('themeBtn').addEventListener('click', () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  store.set('theme', next);
  applyTheme(next);
  postToEditor({ type: 'psToDo-theme', theme: next });
});
window.addEventListener('storage', e => { if (e.key === 'psToDo.theme') applyTheme(e.newValue); });
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', () => applyTheme(document.documentElement.getAttribute('data-theme')));
}
applyTheme(document.documentElement.getAttribute('data-theme'));
if (API && /^https?:$/.test(location.protocol)) {
  fetch(API, { credentials: 'same-origin', cache: 'no-store', headers: { 'Accept': 'application/json' } })
    .then(res => (res.ok ? res.json() : null))
    .then(body => { if (body && body.canEdit === true) enableEditing(); })
    .catch(() => { });
}

renderHeader();
renderStale();
setInterval(renderStale, 5 * 60 * 1000);
$('footer').innerHTML = 'Urgency follows each object\'s own triggers: the smallest trigger is critical, the next one is warning, anything beyond is ok. ' +
  'Next alert and Last alerted come from the alert script\'s sent-state file. <span class="no-print">Click a row for its details and alert schedule.</span>' +
  (META.version ? ' &middot; PsToDo v' + esc(META.version) : '');
render();
})();
</script>
</body>
</html>
